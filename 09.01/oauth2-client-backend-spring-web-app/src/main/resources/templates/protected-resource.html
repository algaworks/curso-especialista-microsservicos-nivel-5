<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Protected Resource</title>
</head>
<body>
<h1>Protected Resource</h1>
<p>Authenticated user: <strong th:text="${username}">user</strong></p>
<p>ID token: <strong th:text="${idToken}">id-token</strong></p>
<p>Access token: <strong th:text="${accessToken}">access-token</strong></p>
<p>Access token scopes: <strong th:text="${scopes}">[]</strong></p>

<p>
    <a href="/">Back to home</a>
</p>

<form th:action="@{/logout}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit">Logout</button>
</form>
</body>
</html>
