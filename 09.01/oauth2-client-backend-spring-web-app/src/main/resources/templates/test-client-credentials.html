<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Client Credentials Test</title>
</head>
<body>
<h1>Client Credentials Test</h1>
<p>This page is public and uses algashop-ecommerce-m2m to get an access token.</p>

<div th:if="${hasError}">
    <p><strong>Error:</strong> <span th:text="${errorMessage}">error</span></p>
</div>

<div th:unless="${hasError}">
    <p>Access token: <strong th:text="${accessToken}">access-token</strong></p>
    <p>Token scopes: <strong th:text="${scopes}">[]</strong></p>
    <p>GET /api/v1/products response:</p>
    <pre th:text="${productsResponse}">products-response</pre>
</div>

<p>
    <a href="/">Back to home</a>
</p>
</body>
</html>
